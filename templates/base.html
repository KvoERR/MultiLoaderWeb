<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Возможность переопределения заголовка -->
    <title>{% block title %}MultiLoader{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/drop.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/radio.css') }}">
</head>
<body>
    <header>
        <h1>MultiLoader</h1>
    </header>

    <main class="main-container">
        <form class="upload-form" id="uploadForm">
            <div class="form-container">
                <div class="video-info">
                    <p>Информация</p>
                    <div class="form-group">
                        <input type="text" id="title" name="title" placeholder="Название" required>
                    </div>

                    <div class="form-group">
                        <textarea id="description" name="description" placeholder="Описание" rows="4" style="resize: none;"></textarea>
                    </div>

                    <div class="form-group">
                        <select id="category" name="category">
                            <option value="">Выберите категорию</option>
                            <option value="Film & Animation">Фильмы и анимация</option>
                            <option value="Cars & Vehicles">Транспорт</option>
                            <option value="Music">Музыка</option>
                            <option value="Pets & Animals">Животные</option>
                            <option value="Sport">Спорт</option>
                            <option value="Travel & Events">Путешествия</option>
                            <option value="Gaming">Игры</option>
                            <option value="People & Blogs">Люди и блоги</option>
                            <option value="Comedy">Юмор</option>
                            <option value="Entertainment">Развлечения</option>
                            <option value="News & Politics">Новости и политика</option>
                            <option value="How-to & Style">Хобби и стиль</option>
                            <option value="Education">Образование</option>
                            <option value="Science & Technology">Наука и техника</option>
                            <option value="Non-profits & Activism">Общественная деятельность</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <div class="drop-zone" id="videoDropZone">
                            <div class="drop-content">
                                <span class="drop-icon">📁</span>
                                <p class="browse-btn" id="videoBrowseBtn">Выберите файл</p>
                                <input type="file" id="video" name="video" accept="video/*" hidden required>
                            </div>
                        </div>
                        <div class="file-info" id="fileInfo"></div>

                        <div class="drop-zone" id="imageDropZone">
                            <div class="drop-content">
                                <span class="drop-icon">🖼</span>
                                <p class="browse-btn" id="imageBrowseBtn">Загрузите изображение</p>
                                <input type="file" id="image" name="image" accept="image/*" hidden required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <button type="button" onclick="autoTag()">Авто-тэг</button>
                        <input type="text" id="tagList" name="tags" placeholder="Тэги" required>
                    </div>

                    <div class="form-group">
                        <div class="radio-container">
                            <label class="radio-title">Выберите уровень доступа:</label>
                            <div class="radio-choice">
                                <input type="radio" id="public" name="privacy" value="public" checked>
                                <label for="public">Открытый доступ</label>
                            </div>
                                
                            <div class="radio-choice">
                                <input type="radio" id="private" name="privacy" value="private">
                                <label for="private">Закрытый доступ</label>
                            </div>    
                        </div>   
                    </div>
                </div>
                
                <div class="platforms-container">
                    <p>Платформы</p>
                    <div></div> <!-- Пустая ячейка для заголовка -->
                    <div class="platforms">
                        <!-- Telegram -->
                        <label>
                            <input type="checkbox" name="platforms" value="telegram"> 
                            Telegram
                        </label>
                        <button type="button" class="platform-button" onclick="tgAuth()">Привязать</button>

                        <!-- Яндекс Дзен -->
                        <div class="sub-option">
                            <label>
                                <input type="checkbox" id="zenCheckbox" name="platforms" value="yandex"> 
                                Яндекс Дзен
                            </label>
                        </div>
                        <button type="button" class="platform-button" onclick="zenAuth()">Привязать</button>


                        <!-- YouTube -->
                        <label>
                            <input type="checkbox" name="platforms" value="youtube"> 
                            YouTube
                        </label>
                        <button type="button" class="platform-button" onclick="ytAuth()">Подключить</button>

                        <!-- RuTube -->
                        <div class="sub-option">
                            <label>
                                <input type="checkbox" id="rutubeCheckbox" name="platforms" value="rutube"> 
                                RuTube
                            </label>
                        </div>
                        <button type="button" class="platform-button" onclick="rutubeAuth()">Подключить</button>

                        <!-- Кнопка "Обработать" — полная ширина -->
                        <button type="button" onclick="submitForm()" style="grid-column: 1 / -1; margin-top: 16px;">
                            Обработать данные
                        </button>
                    </div>
                    

                    
                </div>

                <div id="info-telegram" class="info-box" style="display: none;"> 
                    <p>
                        1. Добавьте в качестве администратора в свой канал бота <a href="https://t.me/multi_loaderbot">@multi_loaderbot</a><br>
                        2. Напишите в свой канал полное название вашего канала<br>
                        3. Впишите название вашего канала в поле: <input type="text" id="channel-name" placeholder="Название" required>
                    </p>
                    <button type="button" class="platform-button" id="tg-connect-btn" onclick="tgAuth()">Привязать канал</button>
                </div>
                
            </div>
        </form>
        <div id="result" class="result"></div>
        <button id="auth-btn" onclick="openAuthPopup()">
            ℹ️
        </button>

        <div id="auth-popup" class="popup">
            <div class="popup-content">
                <span class="close-btn" onclick="closeAuthPopup()">&times;</span>

                <!-- Вкладки: Вход / Регистрация -->
                <div class="auth-tabs">
                    <button id="loginTabBtn" class="tab-btn active" onclick="switchAuthTab('login')">Вход</button>
                    <button id="registerTabBtn" class="tab-btn" onclick="switchAuthTab('register')">Регистрация</button>
                </div>

                <!-- Форма Входа -->
                <form id="loginForm" class="auth-form" onsubmit="login(event)">
                    <input type="text" placeholder="Логин" name="username" required />
                    <input type="password" placeholder="Пароль" name="password" required />
                    <button type="submit">Войти</button>
                </form>

                <!-- Форма Регистрации -->
                <form id="registerForm" class="auth-form" style="display: none;" onsubmit="register(event)">
                    <input type="text" placeholder="Логин" name="username" required />
                    <input type="password" placeholder="Пароль" name="password" required />
                    <input type="password" placeholder="Подтвердите пароль" name="confirmPassword" required />
                    <button type="submit">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
    </footer>
    <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/form-handler.js') }}"></script>
    <script src="{{ url_for('static', filename='js/file-explorer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/platforms.js') }}"></script>
    <script src="{{ url_for('static', filename='js/user-auth.js') }}"></script>
    
</html>
